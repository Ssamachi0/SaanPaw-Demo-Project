# Runs the API and its database on one machine:
#   JWT_SECRET=$(openssl rand -hex 32) docker compose up --build
# Then create your first admin (see docs/DEPLOYMENT.md).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/saanpaw
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random string of at least 32 characters}
      # Browser origins allowed to call the API, comma separated (the deployed web console and web app).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Set to 1 when a reverse proxy (nginx, Caddy, a cloud load balancer) sits in front.
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - uploads:/data/uploads

volumes:
  mongo-data:
  uploads:
